name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fxus.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/fxus.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан: APK подпишется debug-ключом и не встанет поверх установленного"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fxus-release
          path: app/build/outputs/apk/release/app-release.apk
      # карта имён R8: без неё стектрейс из релиза не расшифровать
      - uses: actions/upload-artifact@v4
        with:
          name: fxus-mapping
          path: app/build/outputs/mapping/release/mapping.txt
